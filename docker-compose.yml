# Local development database. `pnpm db:up` starts it, `pnpm db:down` stops it (data is kept in
# the `neo4j-data` volume). Browser on http://localhost:7474, Bolt on bolt://localhost:7687.
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graph-warden}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Throwaway database for the adapter tests, wiped by every test and kept in memory:
  # `docker compose --profile test up -d --wait neo4j-test`, then NEO4J_TEST_URI=bolt://localhost:7688.
  neo4j-test:
    image: neo4j:5.26-community
    profiles: [test]
    ports:
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/graph-warden
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Throwaway Redis for the ingestion queue tests: `docker compose --profile test up -d --wait
  # redis-test`, then REDIS_TEST_URL=redis://localhost:6380.
  redis-test:
    image: redis:7.4-alpine
    profiles: [test]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Demo (issue #3): `docker compose --profile demo up -d --build --wait`, then
  # `examples/shop/demo.sh`. Its own database in memory, seeded with examples/shop, and the API with
  # demo tokens, bound to localhost only: anyone holding a demo token is that user.
  neo4j-demo:
    image: neo4j:5.26-community
    profiles: [demo]
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7689:7687"
    environment:
      NEO4J_AUTH: neo4j/graph-warden
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Ingests examples/shop as Lea, a lead whose groups cover every team (see examples/shop/users.yaml).
  seed:
    image: graph-warden:local
    build: .
    profiles: [demo]
    depends_on:
      neo4j-demo:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j-demo:7687
      NEO4J_PASSWORD: graph-warden
      GWARDEN_ONTOLOGY: /demo/ontology.yaml
    volumes:
      - ./examples/shop:/demo:ro
      # Uncomment for vertex or google-cloud, after `gcloud auth application-default login`.
      # - ~/.config/gcloud:/home/node/.config/gcloud:ro
    command: >-
      gwarden ingest /demo/docs --source docs:shop --user lea
      --team dev --team dev-leads --team bff --team front-a --team front-b --team front-c
      --team shopping-front --team user --team data

  api:
    image: graph-warden:local
    profiles: [demo]
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    # A model served on the host (Ollama, LM Studio) is at host.docker.internal, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEO4J_URI: bolt://neo4j-demo:7687
      NEO4J_PASSWORD: graph-warden
      GWARDEN_IDENTITY: demo
      GWARDEN_DEMO: i-understand-anyone-with-a-token-is-that-user
      GWARDEN_DEMO_USERS: /demo/users.yaml
      GWARDEN_ONTOLOGY: /demo/ontology.yaml
      GWARDEN_AUDITORS: auditors
      GWARDEN_WRITERS: dev-leads
      # The web app at http://localhost:8080, signed in with a demo token. Demo value only.
      GWARDEN_WEB_SECRET: demo-only-web-session-secret-change-me
      # Set to claude for questions: with ANTHROPIC_API_KEY, or on a Google platform (vertex,
      # google-cloud) with your Google credentials mounted, see the volume below. Or to openai,
      # with GWARDEN_LLM_MODEL and OPENAI_API_KEY or GWARDEN_LLM_BASE_URL (an Ollama on the host:
      # http://host.docker.internal:11434/v1).
      GWARDEN_LLM: ${GWARDEN_LLM:-none}
      GWARDEN_LLM_PLATFORM: ${GWARDEN_LLM_PLATFORM:-anthropic}
      GWARDEN_LLM_MODEL: ${GWARDEN_LLM_MODEL:-}
      GWARDEN_LLM_BASE_URL: ${GWARDEN_LLM_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-}
      ANTHROPIC_GOOGLE_CLOUD_WORKSPACE_ID: ${ANTHROPIC_GOOGLE_CLOUD_WORKSPACE_ID:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ./examples/shop:/demo:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  neo4j-data:
