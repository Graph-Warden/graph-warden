# Demo identities for GWARDEN_IDENTITY=demo. The groups are what a directory (LDAP, Entra ID, Cloud
# Identity) would report with nested groups resolved: `dev-leads` is a member of every team group,
# so Lea is in all of them. Anyone holding a token is that user: never expose this API.
- token: demo-lea-1b7f3c9e2a4d
  user: lea
  teams: [dev, dev-leads, bff, front-a, front-b, front-c, shopping-front, user, data]
