apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gw.fullname" . }}
  labels:
    {{- include "gw.labels" . | nindent 4 }}
data:
  {{- if .Values.ontology }}
  ontology.yaml: |
    {{- .Values.ontology | nindent 4 }}
  {{- end }}
  {{- if .Values.worker.connectors }}
  connectors.yaml: |
    {{- .Values.worker.connectors | nindent 4 }}
  {{- end }}
  # The worker's repositories, each cloned under /var/lib/gwarden.
  repositories.yaml: |
    {{- if .Values.worker.repositories }}
    {{- range .Values.worker.repositories }}
    - name: {{ required "worker.repositories[].name is required" .name | quote }}
      dir: {{ printf "/var/lib/gwarden/%s" (regexReplaceAll "[^A-Za-z0-9._-]" .name "-") | quote }}
      branch: {{ default "main" .branch | quote }}
      scope: {{ required "worker.repositories[].scope is required" .scope | quote }}
      author: {{ required "worker.repositories[].author is required" .author | toJson }}
    {{- end }}
    {{- else }}
    []
    {{- end }}
  # Clones every repository that is not there yet.
  clone.sh: |
    set -eu
    {{- range .Values.worker.repositories }}
    dir={{ printf "/var/lib/gwarden/%s" (regexReplaceAll "[^A-Za-z0-9._-]" .name "-") | quote }}
    [ -d "$dir/.git" ] || git clone --quiet --branch {{ default "main" .branch | quote }} {{ required "worker.repositories[].url is required" .url | quote }} "$dir"
    {{- end }}
