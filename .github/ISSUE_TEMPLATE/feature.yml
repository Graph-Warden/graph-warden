name: Feature
description: Propose a capability or a change in behaviour.
labels: [enhancement, "stage: to be reviewed"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: access
    attributes:
      label: Impact on access rules
      description: Does this expose nodes, events or metadata in a new way? How do scopes apply?
