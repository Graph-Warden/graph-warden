name: Bug
description: Something does not behave as documented.
labels: [bug, "stage: to be reviewed"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest setup that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
