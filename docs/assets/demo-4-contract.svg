<svg xmlns="http://www.w3.org/2000/svg" width="862" height="378" viewBox="0 0 862 378" role="img" aria-label="One contract, two teams, each sees its side">
  <title>One contract, two teams, each sees its side</title>
  <rect width="862" height="378" rx="10" fill="#0f1419"/>
  <path d="M0 10a10 10 0 0 1 10-10h842a10 10 0 0 1 10 10v18H0z" fill="#1c232b"/>
  <circle cx="18" cy="14" r="5.5" fill="#ff5f57"/><circle cx="36" cy="14" r="5.5" fill="#febc2e"/><circle cx="54" cy="14" r="5.5" fill="#28c840"/>
  <text x="431" y="18" text-anchor="middle" fill="#7d8a96" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">One contract, two teams, each sees its side</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" xml:space="preserve" style="white-space:pre">
  <text x="18" y="58"><tspan fill="#7fd18b">$ </tspan><tspan fill="#e6edf3" font-weight="600">GWARDEN_TOKEN=$MARIE gwarden traverse clickstream-events --direction in --depth 2   # shopping-front</tspan></text>
  <text x="18" y="78"><tspan fill="#d6dde4">Decision  adr-0003-versioned-clickstream  "ADR 0003: a versioned clickstream contract"  </tspan><tspan fill="#6cb6ff">[shared]</tspan></text>
  <text x="18" y="98"><tspan fill="#d6dde4">Module    web-tracking  "web tracking"  </tspan><tspan fill="#6cb6ff">[team:shopping-front]</tspan></text>
  <text x="18" y="118"><tspan fill="#d6dde4">Change    release-2026-42  "Release 2026.42"  </tspan><tspan fill="#6cb6ff">[team:shopping-front]</tspan></text>
  <text x="18" y="138"><tspan fill="#7d8a96">3 nodes reachable as marie.</tspan></text>
  <text x="18" y="158"><tspan fill="#d6dde4"></tspan></text>
  <text x="18" y="178"><tspan fill="#7fd18b">$ </tspan><tspan fill="#e6edf3" font-weight="600">GWARDEN_TOKEN=$SOFIA gwarden traverse incident-208 --direction both --depth 1     # data</tspan></text>
  <text x="18" y="198"><tspan fill="#d6dde4">Decision  adr-0003-versioned-clickstream  "ADR 0003: a versioned clickstream contract"  </tspan><tspan fill="#6cb6ff">[shared]</tspan></text>
  <text x="18" y="218"><tspan fill="#d6dde4">Dashboard conversion-dashboard  "Conversion dashboard (Looker)"  </tspan><tspan fill="#6cb6ff">[team:data]</tspan></text>
  <text x="18" y="238"><tspan fill="#7d8a96">2 nodes reachable as sofia.</tspan></text>
  <text x="18" y="258"><tspan fill="#d6dde4"></tspan></text>
  <text x="18" y="278"><tspan fill="#7fd18b">$ </tspan><tspan fill="#e6edf3" font-weight="600">GWARDEN_TOKEN=$LEA gwarden traverse incident-208 --direction both --depth 1       # every team</tspan></text>
  <text x="18" y="298"><tspan fill="#d6dde4">Decision  adr-0003-versioned-clickstream  "ADR 0003: a versioned clickstream contract"  </tspan><tspan fill="#6cb6ff">[shared]</tspan></text>
  <text x="18" y="318"><tspan fill="#d6dde4">Dashboard conversion-dashboard  "Conversion dashboard (Looker)"  </tspan><tspan fill="#6cb6ff">[team:data]</tspan></text>
  <text x="18" y="338"><tspan fill="#d6dde4">Change    release-2026-42  "Release 2026.42"  </tspan><tspan fill="#6cb6ff">[team:shopping-front]</tspan></text>
  <text x="18" y="358"><tspan fill="#7d8a96">3 nodes reachable as lea.</tspan></text>
  </g>
</svg>
